<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeStream Pro | Watch Now</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background-color: #0b0e14; color: white; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        #player { width: 100%; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background: #000; }
        .ep-btn { background: #1e293b; padding: 8px; border-radius: 6px; text-align: center; cursor: pointer; font-size: 12px; transition: 0.3s; }
        .ep-btn:hover { background: #f97316; }
        .active-ep { background: #f97316 !important; }
    </style>
</head>
<body>

    <nav class="p-4 flex flex-col md:flex-row justify-between items-center glass sticky top-0 z-50 gap-4">
        <h1 class="text-2xl font-black text-orange-500 cursor-pointer" onclick="location.reload()">ANIME<span class="text-white">STREAM</span></h1>
        <div class="flex w-full md:w-auto">
            <input id="searchQuery" type="text" placeholder="Search (e.g. Naruto)..." class="bg-slate-800 px-4 py-2 rounded-l-lg outline-none w-full md:w-64">
            <button onclick="searchAnime()" class="bg-orange-500 px-6 py-2 rounded-r-lg font-bold">Search</button>
        </div>
    </nav>

    <div class="container mx-auto p-4">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            
            <!-- Player Section -->
            <div class="lg:col-span-3">
                <div id="player" class="shadow-2xl">
                    <div class="h-full w-full flex flex-col items-center justify-center text-gray-500">
                        <p class="mb-2">Select an anime and episode to play</p>
                    </div>
                </div>
                
                <div class="mt-4 p-4 glass rounded-xl">
                    <h2 id="animeTitle" class="text-2xl font-bold text-orange-500">Welcome!</h2>
                    <p id="animeDesc" class="text-gray-400 mt-2 text-sm">Search for your favorite anime or select from trending.</p>
                </div>

                <div class="mt-6">
                    <h3 class="text-lg font-bold mb-4 flex items-center gap-2">
                        <span class="w-2 h-6 bg-orange-500 rounded-full"></span> Episodes
                    </h3>
                    <div id="episodeList" class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-10 gap-2">
                        <!-- Episodes -->
                    </div>
                </div>
            </div>

            <!-- Sidebar -->
            <div class="lg:col-span-1">
                <h3 id="sidebarTitle" class="text-xl font-bold mb-4 border-b border-gray-700 pb-2 text-orange-500">Trending Now</h3>
                <div id="searchResults" class="flex flex-col gap-3 max-h-screen overflow-y-auto pr-2">
                    <p class="text-gray-500">Loading anime...</p>
                </div>
            </div>

        </div>
    </div>

    <script>
        // আরও শক্তিশালী একটি API প্রক্সি ব্যবহার করছি
        const API_BASE = "https://consumet-api-three-virid.vercel.app/anime/gogoanime";
        let art = null;

        // ১. ট্রেন্ডিং অ্যানিমে লোড করা (যাতে পেজ খালি না থাকে)
        async function loadTrending() {
            try {
                const res = await fetch(`${API_BASE}/top-airing`);
                const data = await res.json();
                displayResults(data.results);
            } catch (err) {
                document.getElementById('searchResults').innerHTML = "API is currently busy. Try searching.";
            }
        }

        // ২. সার্চ ফাংশন
        async function searchAnime() {
            const query = document.getElementById('searchQuery').value;
            if(!query) return;
            
            document.getElementById('searchResults').innerHTML = "Searching...";
            document.getElementById('sidebarTitle').innerText = "Search Results";

            try {
                const res = await fetch(`${API_BASE}/${query}`);
                const data = await res.json();
                displayResults(data.results);
            } catch (err) {
                alert("Search failed. Try again.");
            }
        }

        // ৩. রেজাল্ট দেখানো
        function displayResults(results) {
            const container = document.getElementById('searchResults');
            container.innerHTML = "";
            results.forEach(anime => {
                container.innerHTML += `
                    <div onclick="loadInfo('${anime.id}')" class="glass p-2 rounded-lg cursor-pointer flex gap-3 hover:bg-orange-500/20 transition group">
                        <img src="${anime.image}" class="w-16 h-20 object-cover rounded shadow-lg group-hover:scale-105 transition">
                        <div class="overflow-hidden">
                            <h4 class="text-xs font-bold truncate">${anime.title}</h4>
                            <p class="text-[10px] text-gray-400 mt-1 uppercase">${anime.releaseDate || 'Ongoing'}</p>
                        </div>
                    </div>
                `;
            });
        }

        // ৪. এপিসোড ইনফো লোড করা
        async function loadInfo(id) {
            document.getElementById('episodeList').innerHTML = "Loading episodes...";
            try {
                const res = await fetch(`${API_BASE}/info/${id}`);
                const data = await res.json();
                
                document.getElementById('animeTitle').innerText = data.title;
                document.getElementById('animeDesc').innerText = data.description || "No description.";

                const epList = document.getElementById('episodeList');
                epList.innerHTML = "";
                data.episodes.forEach(ep => {
                    epList.innerHTML += `<div onclick="playVideo('${ep.id}', this)" class="ep-btn">Ep ${ep.number}</div>`;
                });
                
                // স্ক্রল করে উপরে নিয়ে যাওয়া (মোবাইলের জন্য ভালো)
                window.scrollTo({top: 0, behavior: 'smooth'});
            } catch (err) {
                alert("Could not load episodes.");
            }
        }

        // ৫. ভিডিও প্লে করা
        async function playVideo(epId, btnElement) {
            // Active button style
            document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active-ep'));
            btnElement.classList.add('active-ep');

            try {
                const res = await fetch(`${API_BASE}/watch/${epId}`);
                const data = await res.json();
                const source = data.sources.find(s => s.quality === 'default' || s.quality === 'backup') || data.sources[0];

                if (art) art.destroy();

                art = new ArtPlayer({
                    container: '#player',
                    url: source.url,
                    type: 'm3u8',
                    customType: {
                        m3u8: function (video, url) {
                            if (Hls.isSupported()) {
                                const hls = new Hls();
                                hls.loadSource(url);
                                hls.attachMedia(video);
                            } else {
                                video.src = url;
                            }
                        },
                    },
                    autoplay: true,
                    pip: true,
                    fullscreen: true,
                    setting: true,
                    theme: '#f97316',
                });
            } catch (err) {
                alert("Video source not found.");
            }
        }

        // পেজ লোড হলে ট্রেন্ডিং দেখাবে
        window.onload = loadTrending;
    </script>
</body>
</html>
