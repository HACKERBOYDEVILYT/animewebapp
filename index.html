<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Air TV - Private Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: linear-gradient(to bottom, #ffffff, #f9faff); font-family: 'Inter', sans-serif; color: #333; }
        .btn-3d { transition: all 0.2s; border-bottom: 5px solid rgba(0,0,0,0.2); }
        .btn-3d:active { transform: translateY(4px); border-bottom-width: 1px; }
        .orange-text { color: #ff5e00; }
        .orange-bg { background-color: #ff5e00; }
        .hidden-content { display: none; }
    </style>
</head>
<body class="min-h-screen pb-24 overflow-x-hidden">

    <!-- Login Screen (এটি প্রথমে দেখাবে) -->
    <div id="loginPage" class="fixed inset-0 z-[2000] bg-white flex items-center justify-center p-6">
        <div class="w-full max-w-sm text-center">
            <div class="w-20 h-20 orange-bg rounded-[30px] mx-auto mb-6 flex items-center justify-center text-white text-3xl shadow-2xl shadow-orange-200">
                <i class="fa fa-user-lock"></i>
            </div>
            <h2 class="text-3xl font-black italic mb-2">Home Air <span class="orange-text text-sm bg-orange-50 px-2 rounded">TV</span></h2>
            <p class="text-[10px] text-gray-400 font-bold uppercase tracking-[0.3em] mb-10">Private Access Only</p>

            <div class="space-y-4">
                <input id="uName" type="text" placeholder="Username" class="w-full bg-gray-50 p-4 rounded-2xl outline-none border border-transparent focus:border-orange-500 font-medium text-sm">
                <input id="uPass" type="password" placeholder="Password" class="w-full bg-gray-50 p-4 rounded-2xl outline-none border border-transparent focus:border-orange-500 font-medium text-sm">
                <p id="errorMsg" class="text-red-500 text-[10px] font-bold uppercase hidden">Wrong Username or Password!</p>
                <button onclick="handleLogin()" class="w-full orange-bg text-white p-4 rounded-2xl font-black uppercase tracking-widest text-xs shadow-xl shadow-orange-200 active:scale-95 transition">
                    Access Dashboard
                </button>
            </div>
        </div>
    </div>

    <!-- Main Dashboard (লগইন করার পর এটি দেখাবে) -->
    <div id="dashboard" class="hidden-content">
        <!-- Top Header -->
        <header class="p-4 flex justify-between items-center bg-white/50 sticky top-0 z-50 backdrop-blur-md">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 orange-bg rounded-full flex items-center justify-center text-white">
                    <i class="fa fa-tv"></i>
                </div>
                <div>
                    <h1 class="text-lg font-black tracking-tight uppercase">Home Air <span class="text-[10px] orange-text italic">TV</span></h1>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="handleLogout()" class="text-gray-400 hover:text-red-500 transition"><i class="fa fa-sign-out-alt"></i></button>
                <img src="https://i.pravatar.cc/150?u=robiul" class="w-10 h-10 rounded-full border-2 border-orange-500">
            </div>
        </header>

        <!-- Welcome Section -->
        <section class="px-6 py-6">
            <div class="inline-block bg-orange-50 text-orange-600 px-4 py-1 rounded-full text-[10px] font-bold uppercase mb-4 border border-orange-100">
                <i class="fa fa-circle text-[6px] mr-1"></i> System Online
            </div>
            <h2 class="text-3xl font-black">Welcome back,<br><span id="displayUser" class="orange-text italic">User!</span> 👋</h2>
        </section>

        <!-- Grid Buttons -->
        <section class="px-6 grid grid-cols-2 gap-4 my-4">
            <button class="btn-3d bg-blue-500 text-white p-5 rounded-2xl flex items-center gap-2 font-bold text-sm shadow-lg shadow-blue-50">
                <i class="fa fa-tv"></i> Live TV
            </button>
            <button class="btn-3d bg-emerald-500 text-white p-5 rounded-2xl flex items-center gap-2 font-bold text-sm shadow-lg shadow-emerald-50">
                <i class="fa fa-trophy"></i> Sports TV
            </button>
            <button class="btn-3d bg-indigo-500 text-white p-5 rounded-2xl flex items-center gap-2 font-bold text-sm shadow-lg shadow-indigo-50">
                <i class="fa fa-film"></i> Movies
            </button>
            <button class="btn-3d bg-orange-500 text-white p-5 rounded-2xl flex items-center gap-2 font-bold text-sm shadow-lg shadow-orange-50">
                <i class="fa fa-wand-magic-sparkles"></i> Anime
            </button>
        </section>

        <!-- Time -->
        <section class="px-6 mt-10 text-center">
            <div class="bg-gray-50 p-10 rounded-[40px] border border-gray-100 shadow-inner">
                <p class="text-[8px] text-gray-400 font-black uppercase tracking-[0.3em] mb-2">Local Time</p>
                <h3 id="clock" class="text-4xl font-black orange-text italic">00:00:00 PM</h3>
            </div>
        </section>

        <!-- Bottom Nav -->
        <nav class="fixed bottom-0 left-0 right-0 p-4 flex justify-between items-center bg-white/80 backdrop-blur-md border-t border-gray-100">
            <div class="flex flex-col items-center orange-text"><i class="fa fa-th-large text-xl"></i><span class="text-[8px] font-bold uppercase">Home</span></div>
            <div class="text-gray-300"><i class="fa fa-tv text-xl"></i></div>
            <div class="text-gray-300"><i class="fa fa-film text-xl"></i></div>
            <div class="text-gray-300"><i class="fa fa-heart text-xl"></i></div>
            <div class="text-gray-300"><i class="fa fa-user text-xl"></i></div>
        </nav>
    </div>

    <script>
        // আপনার পার্সোনাল আইডি এবং পাসওয়ার্ড এখানে পরিবর্তন করতে পারেন
        const CORRECT_USER = "admin";
        const CORRECT_PASS = "1234";

        function handleLogin() {
            const user = document.getElementById('uName').value;
            const pass = document.getElementById('uPass').value;
            const error = document.getElementById('errorMsg');

            if (user === CORRECT_USER && pass === CORRECT_PASS) {
                localStorage.setItem('tv_access', 'true');
                localStorage.setItem('tv_user', user);
                checkAccess();
            } else {
                error.classList.remove('hidden');
            }
        }

        function checkAccess() {
            const hasAccess = localStorage.getItem('tv_access');
            const user = localStorage.getItem('tv_user');
            
            if (hasAccess === 'true') {
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden-content');
                document.getElementById('displayUser').innerText = user.toUpperCase() + "!";
            } else {
                document.getElementById('loginPage').classList.remove('hidden');
                document.getElementById('dashboard').classList.add('hidden-content');
            }
        }

        function handleLogout() {
            localStorage.removeItem('tv_access');
            localStorage.removeItem('tv_user');
            location.reload();
        }

        // ঘড়ি ফাংশন
        function updateClock() {
            const now = new Date();
            let h = now.getHours();
            let m = now.getMinutes();
            let s = now.getSeconds();
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            m = m < 10 ? '0'+m : m;
            s = s < 10 ? '0'+s : s;
            document.getElementById('clock').innerText = `${h}:${m}:${s} ${ampm}`;
        }

        setInterval(updateClock, 1000);
        window.onload = checkAccess;
    </script>
</body>
</html>
