<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HiStream | No Limits</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #06090f; color: white; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        #player-container { width: 100%; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background: #000; box-shadow: 0 0 40px rgba(0,0,0,0.6); }
        iframe { width: 100%; height: 100%; border: none; }
        .ep-btn { background: #111827; padding: 12px; border-radius: 8px; font-weight: bold; transition: 0.2s; border: 1px solid #1f2937; text-align: center; cursor: pointer; }
        .ep-btn:hover { background: #ff5c00; border-color: white; transform: translateY(-2px); }
        .active-ep { background: #ff5c00 !important; border-color: white !important; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #ff5c00; border-radius: 10px; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="p-4 flex flex-col md:flex-row justify-between items-center glass sticky top-0 z-50 gap-4">
        <h1 class="text-3xl font-black text-[#ff5c00] tracking-tighter cursor-pointer" onclick="location.reload()">HI<span class="text-white">STREAM</span></h1>
        <div class="flex w-full md:w-[500px]">
            <input id="searchInp" type="text" placeholder="Search any anime..." class="bg-[#111827] px-5 py-3 rounded-l-xl outline-none w-full border border-gray-800 focus:border-[#ff5c00]">
            <button onclick="searchAnime()" class="bg-[#ff5c00] px-8 py-3 rounded-r-xl font-black hover:bg-[#e65300] transition">SEARCH</button>
        </div>
    </nav>

    <div class="container mx-auto p-4 mt-4">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            
            <!-- Main Content -->
            <div class="lg:col-span-3">
                <div id="player-container">
                    <div id="placeholder" class="h-full w-full flex flex-col items-center justify-center text-gray-500">
                        <p class="text-lg">Select an anime from the list to watch</p>
                    </div>
                </div>
                
                <div class="mt-6 p-6 glass rounded-2xl border-l-[6px] border-[#ff5c00]">
                    <h2 id="animeTitle" class="text-3xl font-black">Streaming Now</h2>
                    <p id="animeDesc" class="text-gray-400 mt-3 text-sm leading-relaxed">High-quality anime streaming without limits.</p>
                </div>

                <div class="mt-10">
                    <h3 class="text-xl font-bold mb-6 flex items-center gap-2 uppercase tracking-widest">
                        <span class="h-6 w-1.5 bg-[#ff5c00] rounded-full"></span> Episodes
                    </h3>
                    <div id="episodeList" class="grid grid-cols-4 sm:grid-cols-8 md:grid-cols-10 gap-2">
                        <!-- Eps -->
                    </div>
                </div>
            </div>

            <!-- Sidebar -->
            <div class="lg:col-span-1">
                <h3 id="sideTitle" class="text-xl font-bold mb-6 text-[#ff5c00] border-b border-gray-800 pb-2">TRENDING</h3>
                <div id="results" class="flex flex-col gap-4 overflow-y-auto max-h-[80vh] pr-2 custom-scroll">
                    <!-- Loading skeleton -->
                    <p class="text-gray-700 italic">Loading trends...</p>
                </div>
            </div>

        </div>
    </div>

    <script>
        // API Configuration
        const ANILIST_URL = 'https://graphql.anilist.co';
        const CONSUMET_URL = 'https://api.consumet.org/anime/gogoanime';
        
        // ১. ট্রেন্ডিং লোড (AniList - No rate limit)
        async function loadTrending() {
            const query = `query { Page(perPage: 15) { media(sort: TRENDING_DESC, type: ANIME) { title { english romaji } coverImage { large } } } }`;
            try {
                const res = await fetch(ANILIST_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });
                const { data } = await res.json();
                displayResults(data.Page.media);
            } catch (err) { console.log(err); }
        }

        // ২. সার্চ
        async function searchAnime() {
            const val = document.getElementById('searchInp').value;
            if(!val) return;
            const query = `query { Page(perPage: 20) { media(search: "${val}", type: ANIME) { title { english romaji } coverImage { large } } } }`;
            document.getElementById('results').innerHTML = "Searching...";
            try {
                const res = await fetch(ANILIST_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });
                const { data } = await res.json();
                displayResults(data.Page.media);
            } catch (err) { console.log(err); }
        }

        function displayResults(list) {
            const resDiv = document.getElementById('results');
            resDiv.innerHTML = "";
            list.forEach(anime => {
                const title = anime.title.english || anime.title.romaji;
                resDiv.innerHTML += `
                    <div onclick="getEpisodes('${title}')" class="glass p-2 rounded-xl cursor-pointer flex gap-3 hover:bg-[#ff5c0010] border border-transparent hover:border-[#ff5c0030] transition group">
                        <img src="${anime.coverImage.large}" class="w-14 h-20 object-cover rounded-lg group-hover:scale-105 transition">
                        <div class="flex flex-col justify-center">
                            <h4 class="text-xs font-bold line-clamp-2">${title}</h4>
                        </div>
                    </div>`;
            });
        }

        // ৩. এপিসোড লিস্ট আনা
        async function getEpisodes(title) {
            document.getElementById('episodeList').innerHTML = "Loading...";
            try {
                const sRes = await fetch(`${CONSUMET_URL}/${title}`);
                const sData = await sRes.json();
                const animeId = sData.results[0].id;

                const iRes = await fetch(`${CONSUMET_URL}/info/${animeId}`);
                const iData = await iRes.json();

                document.getElementById('animeTitle').innerText = iData.title;
                document.getElementById('animeDesc').innerHTML = iData.description || "No description.";
                
                const epDiv = document.getElementById('episodeList');
                epDiv.innerHTML = "";
                iData.episodes.forEach(ep => {
                    epDiv.innerHTML += `<div onclick="playEmbed('${ep.id}', this)" class="ep-btn">${ep.number}</div>`;
                });
                window.scrollTo({top: 0, behavior: 'smooth'});
            } catch (err) { alert("Episodes not found for this anime."); }
        }

        // ৪. ভিডিও প্লে করা (EMBED METHOD - NO BUSY ERROR)
        async function playEmbed(epId, btn) {
            document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active-ep'));
            btn.classList.add('active-ep');

            // এই লিঙ্কটি সরাসরি Gogoanime-এর অফিসিয়াল এম্বেড সার্ভার ব্যবহার করে
            const embedUrl = `https://un-block.me/api/embed?id=${epId}`; 
            
            // নিচের লিঙ্কটিও ট্রাই করতে পারেন যদি উপরেরটি কাজ না করে
            // const embedUrl = `https://api.consumet.org/anime/gogoanime/watch/${epId}?server=gogocdn`;

            document.getElementById('player-container').innerHTML = `
                <iframe src="https://www.social-stream.to/embed/gogoanime/${epId}" 
                allowfullscreen="true" scrolling="no" allow="autoplay; encrypted-media"></iframe>
            `;
        }

        window.onload = loadTrending;
    </script>
</body>
</html>
