<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HiStream | Multi-Language Anime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #06090f; color: white; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .anime-card { cursor: pointer; transition: 0.4s; position: relative; overflow: hidden; border-radius: 12px; }
        .anime-card:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(255, 92, 0, 0.3); }
        .anime-card img { width: 100%; height: 260px; object-fit: cover; border-radius: 12px; }
        #player-box { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 15px; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
        .ep-btn { background: #111827; padding: 10px; border-radius: 6px; font-weight: bold; border: 1px solid #1f2937; text-align: center; cursor: pointer; font-size: 13px; }
        .ep-btn:hover, .active-ep { background: #ff5c00; border-color: white; }
        .lang-btn { padding: 6px 15px; border-radius: 20px; font-size: 11px; font-weight: bold; border: 1px solid #333; transition: 0.3s; }
        .lang-active { background: #ff5c00; border-color: white; }
        .hidden { display: none; }
        .loading { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #ff5c00; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <nav class="p-4 flex flex-col md:flex-row justify-between items-center glass sticky top-0 z-50 gap-4">
        <h1 class="text-3xl font-black text-[#ff5c00] tracking-tighter cursor-pointer" onclick="goHome()">HI<span class="text-white">STREAM</span></h1>
        <div class="flex w-full md:w-[500px]">
            <input id="searchInp" type="text" placeholder="Search anime..." class="bg-[#111827] px-5 py-3 rounded-l-xl outline-none w-full border border-gray-800 focus:border-[#ff5c00]">
            <button onclick="searchAnime()" class="bg-[#ff5c00] px-8 py-3 rounded-r-xl font-black">SEARCH</button>
        </div>
    </nav>

    <div class="container mx-auto p-4">
        
        <!-- Detail View -->
        <div id="detailView" class="hidden">
            <button onclick="goHome()" class="mb-6 text-[#ff5c00] font-bold">← BACK</button>
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="lg:col-span-2">
                    <div id="player-box"></div>
                    
                    <!-- Language Selection -->
                    <div class="mt-4 flex flex-wrap gap-3 items-center">
                        <span class="text-xs font-bold text-gray-500 uppercase">Audio:</span>
                        <button onclick="changeLang('jp')" id="btn-jp" class="lang-btn lang-active">JAPANESE (SUB)</button>
                        <button onclick="changeLang('en')" id="btn-en" class="lang-btn">ENGLISH (DUB)</button>
                        <button onclick="changeLang('bn')" id="btn-bn" class="lang-btn">BANGLA</button>
                    </div>

                    <div class="mt-6 p-6 glass rounded-2xl border-l-[6px] border-[#ff5c00]">
                        <h2 id="detTitle" class="text-2xl font-black"></h2>
                        <p id="detDesc" class="text-gray-400 mt-2 text-sm leading-relaxed"></p>
                    </div>
                </div>
                <div>
                    <h3 class="text-xl font-black mb-4 text-[#ff5c00]">EPISODES</h3>
                    <div id="epList" class="grid grid-cols-5 gap-2 max-h-[500px] overflow-y-auto pr-2"></div>
                </div>
            </div>
        </div>

        <!-- Home View -->
        <div id="homeView">
            <h3 id="sectionTitle" class="text-xl font-black mb-6 tracking-widest text-[#ff5c00]">TRENDING NOW</h3>
            <div id="animeGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-6"></div>
            <div id="loader" class="flex justify-center p-20 hidden"><div class="loading"></div></div>
        </div>
    </div>

    <script>
        const ANILIST = 'https://graphql.anilist.co';
        const CONSUMET = 'https://api.consumet.org/anime/gogoanime';
        
        let currentAnimeTitle = "";
        let currentLang = 'jp'; 
        let currentEpId = "";

        function goHome() {
            document.getElementById('homeView').classList.remove('hidden');
            document.getElementById('detailView').classList.add('hidden');
        }

        async function loadTrending() {
            const query = `query { Page(perPage: 24) { media(sort: TRENDING_DESC, type: ANIME) { title { english romaji } coverImage { large } } } }`;
            const res = await fetch(ANILIST, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query })
            });
            const { data } = await res.json();
            renderCards(data.Page.media);
        }

        function renderCards(list) {
            const grid = document.getElementById('animeGrid');
            grid.innerHTML = "";
            list.forEach(anime => {
                const title = anime.title.english || anime.title.romaji;
                grid.innerHTML += `
                    <div class="anime-card" onclick="openAnime('${title.replace(/'/g, "")}')">
                        <img src="${anime.coverImage.large}">
                        <div class="p-2"><h4 class="text-[11px] font-bold truncate">${title}</h4></div>
                    </div>`;
            });
        }

        async function openAnime(title) {
            currentAnimeTitle = title;
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('detailView').classList.remove('hidden');
            fetchEpisodes();
        }

        async function fetchEpisodes() {
            const epList = document.getElementById('epList');
            epList.innerHTML = '<div class="loading"></div>';
            
            // Language logic for search
            let searchQuery = currentAnimeTitle.split(':')[0].split('Season')[0].trim();
            if(currentLang === 'en') searchQuery += " (Dub)";
            
            try {
                const sRes = await fetch(`${CONSUMET}/${searchQuery}`);
                const sData = await sRes.json();
                
                // যদি রেজাল্ট না পায়, তবে সাধারণ নাম দিয়ে চেষ্টা করবে
                let finalAnime = sData.results[0];
                if(!finalAnime && currentLang === 'en') {
                    const fallback = await fetch(`${CONSUMET}/${searchQuery.replace(" (Dub)", "")}`);
                    const fData = await fallback.json();
                    finalAnime = fData.results.find(a => a.id.includes('dub')) || fData.results[0];
                }

                const iRes = await fetch(`${CONSUMET}/info/${finalAnime.id}`);
                const iData = await iRes.json();

                document.getElementById('detTitle').innerText = iData.title;
                document.getElementById('detDesc').innerText = iData.description || "";
                
                epList.innerHTML = "";
                iData.episodes.forEach(ep => {
                    epList.innerHTML += `<button onclick="playVideo('${ep.id}', this)" class="ep-btn">${ep.number}</button>`;
                });

                if(iData.episodes.length > 0) playVideo(iData.episodes[0].id, document.querySelector('.ep-btn'));

            } catch (err) {
                epList.innerHTML = "<p class='text-xs text-red-500'>Episodes not available for this language.</p>";
            }
        }

        function changeLang(lang) {
            if(lang === 'bn') {
                alert("Bangla Dub is only available for some popular anime like Doraemon, Shinchan, or Naruto (Limited). Switching to available source...");
            }
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('lang-active'));
            document.getElementById('btn-' + lang).classList.add('lang-active');
            fetchEpisodes();
        }

        function playVideo(id, btn) {
            document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active-ep'));
            btn.classList.add('active-ep');
            const url = `https://www.social-stream.to/embed/gogoanime/${id}`;
            document.getElementById('player-box').innerHTML = `<iframe src="${url}" allowfullscreen="true" scrolling="no"></iframe>`;
        }

        async function searchAnime() {
            const val = document.getElementById('searchInp').value;
            if(!val) return;
            const query = `query { Page(perPage: 24) { media(search: "${val}", type: ANIME) { title { english romaji } coverImage { large } } } }`;
            const res = await fetch(ANILIST, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query }) });
            const { data } = await res.json();
            renderCards(data.Page.media);
        }

        window.onload = loadTrending;
    </script>
</body>
</html>
