<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeStream | Ultimate Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background-color: #0b0e11; color: white; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .anime-card:hover img { transform: scale(1.1); transition: 0.5s; }
        #player { width: 100%; aspect-ratio: 16/9; border-radius: 12px; background: #000; overflow: hidden; }
        .ep-grid button { background: #1a1f26; padding: 10px; border-radius: 8px; font-weight: bold; transition: 0.3s; border: 1px solid #333; }
        .ep-grid button:hover { background: #ff5c00; border-color: white; }
        .active-ep { background: #ff5c00 !important; color: white; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="p-4 flex flex-col md:flex-row justify-between items-center glass sticky top-0 z-50 gap-4">
        <h1 class="text-3xl font-black text-[#ff5c00] tracking-tighter cursor-pointer" onclick="location.reload()">HI<span class="text-white">STREAM</span></h1>
        <div class="flex w-full md:w-[500px]">
            <input id="searchInp" type="text" placeholder="Search anime, movies..." class="bg-[#1a1f26] px-5 py-3 rounded-l-xl outline-none w-full border border-gray-800 focus:border-[#ff5c00]">
            <button onclick="searchAnime()" class="bg-[#ff5c00] px-8 py-3 rounded-r-xl font-bold hover:bg-[#e65300] transition">SEARCH</button>
        </div>
    </nav>

    <div class="container mx-auto p-4 mt-4">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            
            <!-- Player Area -->
            <div class="lg:col-span-3">
                <div id="player" class="shadow-2xl">
                    <div class="h-full w-full flex items-center justify-center text-gray-600">
                        <p>Select an anime to start streaming</p>
                    </div>
                </div>
                
                <div class="mt-6 p-6 glass rounded-2xl border-l-4 border-[#ff5c00]">
                    <h2 id="title" class="text-3xl font-bold">Welcome to HiStream</h2>
                    <p id="desc" class="text-gray-400 mt-3 text-sm leading-relaxed">The best place to watch anime for free.</p>
                </div>

                <div class="mt-10">
                    <h3 class="text-xl font-bold mb-5 flex items-center gap-3">
                        <span class="h-8 w-1.5 bg-[#ff5c00] rounded-full"></span> EPISODES
                    </h3>
                    <div id="episodes" class="ep-grid grid grid-cols-4 sm:grid-cols-6 md:grid-cols-10 lg:grid-cols-12 gap-3">
                        <!-- Eps -->
                    </div>
                </div>
            </div>

            <!-- Sidebar -->
            <div class="lg:col-span-1">
                <h3 id="sideTitle" class="text-xl font-bold mb-5 text-[#ff5c00]">TRENDING NOW</h3>
                <div id="results" class="flex flex-col gap-4 overflow-y-auto max-h-[1000px] pr-2">
                    <!-- Cards -->
                </div>
            </div>

        </div>
    </div>

    <script>
        // AniList API (ভেরি স্টেবল)
        const ANILIST_API = 'https://graphql.anilist.co';
        
        // Consumet API (যদি এটি ডাউন থাকে, তবে আপনাকে নিজের ভার্সেল লিঙ্ক ব্যবহার করতে হবে)
        let CONSUMET_URL = "https://consumet-api-three-virid.vercel.app/anime/gogoanime";
        
        let art = null;

        // ১. ট্রেন্ডিং লোড (AniList ব্যবহার করে)
        async function loadTrending() {
            const query = `query { Page(perPage: 15) { media(sort: TRENDING_DESC, type: ANIME) { id idMal title { english romaji } coverImage { large } description type } } }`;
            try {
                const res = await fetch(ANILIST_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });
                const { data } = await res.json();
                displayResults(data.Page.media);
            } catch (err) { console.error(err); }
        }

        // ২. সার্চ
        async function searchAnime() {
            const val = document.getElementById('searchInp').value;
            if(!val) return;
            const query = `query { Page(perPage: 20) { media(search: "${val}", type: ANIME) { id idMal title { english romaji } coverImage { large } description type } } }`;
            document.getElementById('sideTitle').innerText = "RESULTS";
            try {
                const res = await fetch(ANILIST_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });
                const { data } = await res.json();
                displayResults(data.Page.media);
            } catch (err) { console.error(err); }
        }

        function displayResults(list) {
            const resDiv = document.getElementById('results');
            resDiv.innerHTML = "";
            list.forEach(anime => {
                const title = anime.title.english || anime.title.romaji;
                resDiv.innerHTML += `
                    <div onclick="getAnimeInfo('${title}')" class="glass p-2 rounded-xl cursor-pointer flex gap-4 hover:bg-white/5 transition anime-card overflow-hidden">
                        <img src="${anime.coverImage.large}" class="w-16 h-24 object-cover rounded-lg shadow-lg">
                        <div class="flex flex-col justify-center">
                            <h4 class="text-sm font-bold line-clamp-2">${title}</h4>
                            <span class="text-[10px] text-[#ff5c00] font-bold mt-1 uppercase">${anime.type}</span>
                        </div>
                    </div>`;
            });
        }

        // ৩. স্ট্রিমিং ইনফো লোড
        async function getAnimeInfo(title) {
            // টাইটেল থেকে আইডি বের করার জন্য সার্চ
            try {
                const searchRes = await fetch(`${CONSUMET_URL}/${title}`);
                const searchData = await searchRes.json();
                const animeId = searchData.results[0].id;

                const infoRes = await fetch(`${CONSUMET_URL}/info/${animeId}`);
                const infoData = await infoRes.json();

                document.getElementById('title').innerText = infoData.title;
                document.getElementById('desc').innerHTML = infoData.description || "No description.";
                
                const epDiv = document.getElementById('episodes');
                epDiv.innerHTML = "";
                infoData.episodes.forEach(ep => {
                    epDiv.innerHTML += `<button onclick="playVideo('${ep.id}', this)" class="ep-btn">EP ${ep.number}</button>`;
                });
                window.scrollTo({top: 0, behavior: 'smooth'});
            } catch (err) { alert("Video source busy. Please try another anime."); }
        }

        // ৪. প্লেয়ার
        async function playVideo(epId, btn) {
            document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active-ep'));
            btn.classList.add('active-ep');
            
            try {
                const res = await fetch(`${CONSUMET_URL}/watch/${epId}`);
                const data = await res.json();
                const streamUrl = data.sources.find(s => s.quality === 'default').url;

                if (art) art.destroy();
                art = new ArtPlayer({
                    container: '#player',
                    url: streamUrl,
                    type: 'm3u8',
                    customType: {
                        m3u8: (v, url) => {
                            if (Hls.isSupported()) { const hls = new Hls(); hls.loadSource(url); hls.attachMedia(v); }
                            else { v.src = url; }
                        }
                    },
                    autoplay: true,
                    setting: true,
                    fullscreen: true,
                    pip: true,
                    theme: '#ff5c00',
                });
            } catch (err) { alert("Streaming link failed."); }
        }

        window.onload = loadTrending;
    </script>
</body>
</html>
