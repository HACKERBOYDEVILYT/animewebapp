<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Air TV - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: linear-gradient(to bottom, #ffffff, #f9faff); font-family: 'Inter', sans-serif; color: #333; }
        .btn-3d { transition: all 0.2s; border-bottom: 5px solid rgba(0,0,0,0.2); }
        .btn-3d:active { transform: translateY(4px); border-bottom-width: 1px; }
        .bottom-nav { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
        .orange-text { color: #ff5e00; }
        .orange-bg { background-color: #ff5e00; }
        .nav-item.active { color: #ff5e00; border-top: 3px solid #ff5e00; }
    </style>
</head>
<body class="min-h-screen pb-24">

    <!-- Top Header -->
    <header class="p-4 flex justify-between items-center bg-white/50">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-orange-500 rounded-full flex items-center justify-center text-white shadow-lg shadow-orange-200">
                <i class="fa fa-tv text-lg"></i>
            </div>
            <div>
                <h1 class="text-lg font-black tracking-tight leading-none uppercase">Home Air <span class="text-xs bg-orange-100 text-orange-600 px-1 rounded">TV</span></h1>
                <p class="text-[8px] text-gray-400 font-bold tracking-widest uppercase">Future Live IPTV Player</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <div class="bg-gray-100 px-3 py-1 rounded-full flex items-center gap-2 text-[10px] font-bold text-gray-500">
                <span class="flex items-center gap-1"><i class="fa fa-circle text-orange-500 text-[6px]"></i> 1</span>
                <span class="flex items-center gap-1"><i class="fa fa-users"></i> 1</span>
            </div>
            <img src="https://i.pravatar.cc/150?u=robiul" class="w-10 h-10 rounded-full border-2 border-white shadow-md">
        </div>
    </header>

    <!-- Welcome Section -->
    <section class="px-6 py-4">
        <div class="inline-block bg-orange-50 text-orange-600 px-4 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider border border-orange-100 mb-4">
            <i class="fa fa-wand-magic-sparkles mr-1"></i> System Online
        </div>
        <h2 class="text-3xl font-black mb-2">Welcome back, <span class="orange-text">MD Robiul Sorder!</span> 👋</h2>
        <p class="text-gray-400 text-xs font-medium leading-relaxed">Ready to explore? Over 8000+ live IPTV stations are synced and waiting.</p>
    </section>

    <!-- Category Buttons Grid -->
    <section class="px-6 grid grid-cols-2 gap-4 my-6">
        <button class="btn-3d bg-blue-500 text-white p-4 rounded-2xl flex items-center gap-2 font-bold text-sm shadow-lg shadow-blue-100">
            <i class="fa fa-tv"></i> Live TV
        </button>
        <button class="btn-3d bg-emerald-500 text-white p-4 rounded-2xl flex items-center gap-2 font-bold text-sm shadow-lg shadow-emerald-100">
            <i class="fa fa-trophy"></i> Sports TV
        </button>
        <button class="btn-3d bg-cyan-500 text-white p-4 rounded-2xl flex items-center gap-2 font-bold text-sm shadow-lg shadow-cyan-100">
            <i class="fa fa-globe"></i> Home
        </button>
        <button class="btn-3d bg-indigo-500 text-white p-4 rounded-2xl flex items-center gap-2 font-bold text-sm shadow-lg shadow-indigo-100">
            <i class="fa fa-film"></i> Movies
        </button>
        <button class="btn-3d bg-pink-500 text-white p-4 rounded-2xl flex items-center gap-2 font-bold text-sm shadow-lg shadow-pink-100">
            <i class="fa fa-desktop"></i> TV Shows
        </button>
        <button class="btn-3d bg-orange-500 text-white p-4 rounded-2xl flex items-center gap-2 font-bold text-sm shadow-lg shadow-orange-100">
            <i class="fa fa-wand-magic-sparkles"></i> Anime
        </button>
        <button class="btn-3d bg-purple-600 text-white p-4 rounded-2xl flex items-center gap-2 font-bold text-sm shadow-lg shadow-purple-100 col-span-2">
            <i class="fa fa-layer-group"></i> IPTV Playlist
        </button>
    </section>

    <!-- Control Section -->
    <section class="px-6 space-y-4">
        <button class="w-full bg-white border border-gray-100 p-4 rounded-2xl text-xs font-bold flex items-center justify-center gap-2 shadow-sm text-gray-500">
            <i class="fa fa-moon"></i> NIGHT MODE
        </button>

        <!-- Time Section -->
        <div class="bg-gray-50/50 border border-gray-100 p-6 rounded-[40px] text-center shadow-inner mt-6">
            <p class="text-[8px] text-gray-400 font-black uppercase tracking-[0.3em] mb-2">Current Local Time</p>
            <h3 id="clock" class="text-4xl font-black orange-text italic">00:00:00 PM</h3>
            <p class="text-[8px] text-gray-400 font-bold uppercase mt-1">EDT / GMT-4</p>
        </div>
    </section>

    <!-- Floating Ask Me -->
    <div class="fixed bottom-24 right-4 z-[150]">
        <div class="bg-orange-600 p-3 rounded-full shadow-xl shadow-orange-200 relative">
            <i class="fa fa-comment-dots text-white text-xl"></i>
            <div class="absolute -top-1 -right-1 w-3 h-3 bg-emerald-500 border-2 border-white rounded-full"></div>
        </div>
        <div class="bg-black text-white text-[8px] font-black px-2 py-1 rounded-md mt-2 text-center uppercase tracking-tighter">Ask Me?</div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 p-4 flex justify-between items-center bottom-nav border-t border-gray-100 z-[200]">
        <div class="flex flex-col items-center gap-1 nav-item active pt-2">
            <i class="fa fa-th-large text-xl"></i>
            <span class="text-[8px] font-black uppercase">Dashboard</span>
        </div>
        <div class="flex flex-col items-center gap-1 text-gray-400">
            <i class="fa fa-tv text-xl"></i>
            <span class="text-[8px] font-black uppercase">Stream</span>
        </div>
        <div class="flex flex-col items-center gap-1 text-gray-400">
            <i class="fa fa-compass text-xl"></i>
            <span class="text-[8px] font-black uppercase">Browse</span>
        </div>
        <div class="flex flex-col items-center gap-1 text-gray-400">
            <i class="fa fa-film text-xl"></i>
            <span class="text-[8px] font-black uppercase">Cinema</span>
        </div>
        <div class="flex flex-col items-center gap-1 text-gray-400">
            <i class="fa fa-heart text-xl"></i>
            <span class="text-[8px] font-black uppercase">Favorites</span>
        </div>
        <div class="flex flex-col items-center gap-1 text-gray-400">
            <i class="fa fa-broadcast-tower text-xl"></i>
            <span class="text-[8px] font-black uppercase">Remote</span>
        </div>
    </nav>

    <script>
        // Clock Function
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            const strTime = hours + ':' + minutes + ':' + seconds + ' ' + ampm;
            document.getElementById('clock').textContent = strTime;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
