<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Air TV - Firebase Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <style>
        body { background: linear-gradient(to bottom, #ffffff, #f9faff); font-family: 'Inter', sans-serif; color: #333; }
        .modal-blur { background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(10px); }
        .orange-bg { background-color: #ff5e00; }
        .card-item { background: white; border: 1px solid #f0f0f0; border-radius: 20px; }
    </style>
</head>
<body class="min-h-screen pb-24">

    <!-- Header -->
    <header class="p-4 flex justify-between items-center bg-white/60 sticky top-0 z-[100] backdrop-blur-md">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 orange-bg rounded-full flex items-center justify-center text-white"><i class="fa fa-tv"></i></div>
            <h1 class="text-lg font-black uppercase">Home Air <span class="text-orange-500 italic">TV</span></h1>
        </div>

        <!-- Profile Icon -->
        <div onclick="toggleProfileModal()" class="cursor-pointer relative">
            <img id="userAvatar" src="https://www.w3schools.com/howto/img_avatar.png" class="w-10 h-10 rounded-full border-2 border-white shadow-md">
            <div id="statusDot" class="absolute -bottom-1 -right-1 w-4 h-4 bg-gray-300 border-2 border-white rounded-full"></div>
        </div>
    </header>

    <!-- Main Dashboard UI -->
    <section class="px-6 py-8">
        <h2 class="text-3xl font-black mb-2 leading-tight">Welcome,<br><span id="userNameDisp" class="text-orange-500 italic">Guest User!</span> 👋</h2>
        <p class="text-gray-400 text-xs">Login with Google to sync your settings.</p>
    </section>

    <!-- Profile/Login Modal -->
    <div id="profileModal" class="fixed inset-0 z-[1000] hidden flex items-center justify-center modal-blur p-4">
        <div class="bg-white w-full max-w-sm rounded-[40px] p-8 shadow-2xl relative">
            <button onclick="toggleProfileModal()" class="absolute top-6 right-6 text-gray-300 hover:text-orange-500"><i class="fa fa-times text-xl"></i></button>

            <!-- Profile Info -->
            <div class="text-center mb-8">
                <img id="modalAvatar" src="https://www.w3schools.com/howto/img_avatar.png" class="w-20 h-20 rounded-full border-4 border-white shadow-xl mx-auto">
                <h3 id="modalName" class="text-xl font-black mt-4">Guest User</h3>
                <p id="modalEmail" class="text-xs text-gray-400">Please sign in to continue</p>
                <div id="firestoreBadge" class="hidden mt-3">
                    <span class="bg-emerald-50 text-emerald-600 text-[8px] font-black px-4 py-1.5 rounded-full border border-emerald-100 uppercase tracking-widest">
                        <i class="fa fa-circle text-[6px] mr-1"></i> Connected with Firebase
                    </span>
                </div>
            </div>

            <!-- Login Section (যদি লগইন না থাকে) -->
            <div id="loginSection" class="space-y-4">
                <button onclick="googleLogin()" class="w-full flex items-center justify-center gap-3 bg-white border border-gray-200 p-4 rounded-2xl font-bold text-xs hover:bg-gray-50 transition shadow-sm">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" class="w-5">
                    Sign in with Google
                </button>
            </div>

            <!-- Settings Section (যদি লগইন থাকে) -->
            <div id="settingsSection" class="hidden space-y-3">
                <div class="card-item p-4 flex justify-between items-center text-xs font-bold">
                    <span>Theme Mode</span>
                    <span class="text-orange-500">LIGHT (DAY)</span>
                </div>
                <button onclick="googleLogout()" class="w-full bg-red-50 text-red-600 p-4 rounded-3xl font-black uppercase text-[10px] border border-red-100 mt-4">
                    Disconnect Account
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- ফায়ারবেস কনফিগারেশন (আপনার নিজের কী এখানে বসান) ---
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // ফায়ারবেস ইনিশিয়ালাইজ
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();

        // গুগল লগইন ফাংশন
        function googleLogin() {
            auth.signInWithPopup(provider).then((result) => {
                console.log("Logged In:", result.user);
            }).catch((error) => {
                alert(error.message);
            });
        }

        // লগআউট ফাংশন
        function googleLogout() {
            auth.signOut().then(() => {
                location.reload();
            });
        }

        // ইউজারের অবস্থা চেক করা
        auth.onAuthStateChanged((user) => {
            const loginSec = document.getElementById('loginSection');
            const settingsSec = document.getElementById('settingsSection');
            const badge = document.getElementById('firestoreBadge');
            const statusDot = document.getElementById('statusDot');

            if (user) {
                // লগইন থাকলে
                document.getElementById('userNameDisp').innerText = user.displayName + "!";
                document.getElementById('modalName').innerText = user.displayName;
                document.getElementById('modalEmail').innerText = user.email;
                document.getElementById('userAvatar').src = user.photoURL;
                document.getElementById('modalAvatar').src = user.photoURL;
                
                loginSec.classList.add('hidden');
                settingsSec.classList.remove('hidden');
                badge.classList.remove('hidden');
                statusDot.classList.replace('bg-gray-300', 'bg-emerald-500');
            } else {
                // লগইন না থাকলে
                loginSec.classList.remove('hidden');
                settingsSec.classList.add('hidden');
                badge.classList.add('hidden');
            }
        });

        function toggleProfileModal() {
            document.getElementById('profileModal').classList.toggle('hidden');
        }
    </script>
</body>
</html>
