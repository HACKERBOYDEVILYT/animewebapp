<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeStream | Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background-color: #0b0e14; color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        #player { width: 100%; aspect-ratio: 16/9; border-radius: 12px; background: #000; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        .ep-btn { background: #1e293b; padding: 10px; border-radius: 8px; text-align: center; cursor: pointer; transition: 0.3s; font-weight: bold; font-size: 13px; }
        .ep-btn:hover { background: #f97316; transform: scale(1.05); }
        .active-ep { background: #f97316 !important; border: 2px solid white; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #f97316; border-radius: 10px; }
    </style>
</head>
<body>

    <!-- Header -->
    <nav class="p-4 flex flex-col md:flex-row justify-between items-center glass sticky top-0 z-50 gap-4">
        <h1 class="text-2xl font-black text-orange-500 cursor-pointer" onclick="location.reload()">ANIME<span class="text-white">STREAM</span></h1>
        <div class="flex w-full md:w-auto">
            <input id="searchQuery" type="text" placeholder="Search Anime..." class="bg-slate-800 px-4 py-2 rounded-l-lg outline-none w-full md:w-64 border border-slate-700 focus:border-orange-500">
            <button onclick="searchAnime()" class="bg-orange-500 px-6 py-2 rounded-r-lg font-bold hover:bg-orange-600 transition">Search</button>
        </div>
    </nav>

    <div class="container mx-auto p-4">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            
            <!-- Player Section -->
            <div class="lg:col-span-3">
                <div id="player" class="overflow-hidden">
                    <div class="h-full w-full flex flex-col items-center justify-center text-gray-500">
                        <p>Select an anime & episode to watch</p>
                    </div>
                </div>
                
                <div class="mt-4 p-6 glass rounded-xl border-l-4 border-orange-500">
                    <h2 id="animeTitle" class="text-3xl font-bold text-white">Streaming Portal</h2>
                    <p id="animeDesc" class="text-gray-400 mt-3 text-sm leading-relaxed">Search your favorite show and start streaming in HD.</p>
                </div>

                <div class="mt-8">
                    <h3 class="text-xl font-bold mb-4 flex items-center gap-2">Episodes</h3>
                    <div id="episodeList" class="grid grid-cols-4 sm:grid-cols-8 md:grid-cols-12 gap-2">
                        <!-- Episodes -->
                    </div>
                </div>
            </div>

            <!-- Sidebar -->
            <div class="lg:col-span-1">
                <h3 id="sidebarTitle" class="text-xl font-bold mb-4 text-orange-500 border-b border-gray-800 pb-2">Trending</h3>
                <div id="searchResults" class="flex flex-col gap-3 max-h-[80vh] overflow-y-auto pr-2 custom-scrollbar">
                    <p class="text-gray-600">Loading...</p>
                </div>
            </div>

        </div>
    </div>

    <script>
        // খুবই স্টেবল এপিআই ব্যবহার করছি
        const SEARCH_API = "https://api.amvstr.me/api/v2/search?q=";
        const INFO_API = "https://api.amvstr.me/api/v2/info/";
        const STREAM_API = "https://api.amvstr.me/api/v2/stream/";
        const TRENDING_API = "https://api.jikan.moe/v4/top/anime?limit=15";

        let art = null;

        // ১. ট্রেন্ডিং লোড
        async function loadTrending() {
            try {
                const res = await fetch(TRENDING_API);
                const { data } = await res.json();
                const container = document.getElementById('searchResults');
                container.innerHTML = "";
                data.forEach(anime => {
                    container.innerHTML += `
                        <div onclick="searchSpecific('${anime.title}')" class="glass p-2 rounded-lg cursor-pointer flex gap-3 hover:bg-orange-500/20 transition group">
                            <img src="${anime.images.jpg.image_url}" class="w-14 h-20 object-cover rounded shadow-md group-hover:scale-105 transition">
                            <div class="overflow-hidden">
                                <h4 class="text-xs font-bold truncate">${anime.title}</h4>
                                <p class="text-[10px] text-orange-400 mt-1 uppercase">${anime.type} • ${anime.score || 'N/A'}</p>
                            </div>
                        </div>`;
                });
            } catch (err) { console.error(err); }
        }

        // ২. সার্চ
        async function searchAnime() {
            const query = document.getElementById('searchQuery').value;
            if(!query) return;
            searchSpecific(query);
        }

        async function searchSpecific(query) {
            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = "Searching...";
            document.getElementById('sidebarTitle').innerText = "Results";

            try {
                const res = await fetch(SEARCH_API + query);
                const data = await res.json();
                resultsDiv.innerHTML = "";
                
                data.results.forEach(anime => {
                    resultsDiv.innerHTML += `
                        <div onclick="loadInfo('${anime.id}')" class="glass p-2 rounded-lg cursor-pointer flex gap-3 hover:bg-orange-500/20 transition">
                            <img src="${anime.image}" class="w-14 h-20 object-cover rounded">
                            <h4 class="text-xs font-bold">${anime.title}</h4>
                        </div>`;
                });
            } catch (err) { resultsDiv.innerHTML = "Error loading. Try again."; }
        }

        // ৩. এপিসোড লোড
        async function loadInfo(id) {
            document.getElementById('episodeList').innerHTML = "Loading...";
            try {
                const res = await fetch(INFO_API + id);
                const data = await res.json();
                
                document.getElementById('animeTitle').innerText = data.title;
                document.getElementById('animeDesc').innerText = data.description || "No description.";

                const epList = document.getElementById('episodeList');
                epList.innerHTML = "";
                // Ep list (using loop based on total episodes)
                for(let i=1; i<=data.totalEpisodes; i++) {
                    epList.innerHTML += `<div onclick="playVideo('${id}', ${i}, this)" class="ep-btn">Ep ${i}</div>`;
                }
                window.scrollTo({top: 0, behavior: 'smooth'});
            } catch (err) { alert("Failed to load episodes."); }
        }

        // ৪. ভিডিও প্লেয়ার
        async function playVideo(animeId, epNum, btn) {
            document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active-ep'));
            btn.classList.add('active-ep');

            try {
                // Fetching stream link for specific episode
                const res = await fetch(`${STREAM_API}${animeId}/${epNum}`);
                const data = await res.json();
                const videoUrl = data.stream.multi.main.url;

                if (art) art.destroy();

                art = new ArtPlayer({
                    container: '#player',
                    url: videoUrl,
                    type: 'm3u8',
                    customType: {
                        m3u8: (video, url) => {
                            if (Hls.isSupported()) {
                                const hls = new Hls();
                                hls.loadSource(url);
                                hls.attachMedia(video);
                            } else { video.src = url; }
                        },
                    },
                    autoplay: true,
                    fullscreen: true,
                    setting: true,
                    theme: '#f97316',
                    pip: true,
                });
            } catch (err) { alert("Video not available for this episode."); }
        }

        window.onload = loadTrending;
    </script>
</body>
</html>
