<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HiAnime - 100% Working Version</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0b0c10; color: #fff; font-family: 'Inter', sans-serif; }
        .anime-card:hover img { transform: scale(1.05); transition: 0.3s ease-in-out; }
        .cyan-text { color: #45f3ff; }
        .cyan-bg { background-color: #45f3ff; }
        .loader { border: 3px solid #1f2833; border-top: 3px solid #45f3ff; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Header -->
    <nav class="bg-[#1f2833] p-4 sticky top-0 z-50 shadow-2xl">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black cyan-text cursor-pointer" onclick="location.reload()">Hi<span class="text-white">Anime</span></h1>
            <div class="relative w-1/2">
                <input id="searchInput" type="text" placeholder="Search anime..." class="w-full bg-[#0b0c10] p-2 pl-4 rounded-full outline-none border border-gray-700 focus:border-[#45f3ff] text-sm">
                <button onclick="searchAnime()" class="absolute right-3 top-2 cyan-text"><i class="fa fa-search"></i></button>
            </div>
        </div>
    </nav>

    <!-- Player Section -->
    <div id="playerSection" class="hidden p-4 md:p-8 bg-black min-h-screen">
        <button onclick="closePlayer()" class="mb-6 text-gray-400 hover:text-white flex items-center gap-2 font-bold">
            <i class="fa fa-arrow-left"></i> BACK TO HOME
        </button>
        <div class="max-w-5xl mx-auto">
            <div class="aspect-video bg-[#1f2833] rounded-xl overflow-hidden shadow-2xl border border-gray-800">
                <iframe id="mainPlayer" src="" class="w-full h-full" allowfullscreen frameborder="0"></iframe>
            </div>
            <h2 id="playingTitle" class="text-2xl font-bold mt-6 cyan-text"></h2>
            <div id="episodeList" class="flex flex-wrap gap-2 mt-6 p-4 bg-[#1f2833] rounded-xl max-h-48 overflow-y-auto">
                <!-- Episodes -->
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main id="mainContent" class="p-6 max-w-7xl mx-auto">
        <h2 id="listTitle" class="text-xl font-bold mb-8 border-l-4 border-[#45f3ff] pl-4 uppercase tracking-widest">Trending Anime</h2>
        
        <!-- Loader -->
        <div id="loading" class="flex flex-col items-center justify-center my-32 hidden">
            <div class="loader mb-4"></div>
            <p class="text-gray-500 font-bold">LOADING DATA...</p>
        </div>
        
        <div id="animeGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 lg:grid-cols-6 gap-6">
            <!-- Anime Cards -->
        </div>
    </main>

    <script>
        // Jikan API (MyAnimeList) - এটি ১০০% কাজ করবে সবসময়
        const JIKAN_API = "https://api.jikan.moe/v4";
        // Consumet API (Streaming এর জন্য)
        const STREAM_API = "https://api-consumet-org-five.vercel.app/anime/gogoanime";

        const animeGrid = document.getElementById('animeGrid');
        const loading = document.getElementById('loading');

        // ১. ট্রেন্ডিং এনিমে লোড করা (Jikan API ব্যবহার করে)
        async function fetchTrending() {
            showLoading(true);
            try {
                const res = await fetch(`${JIKAN_API}/top/anime?filter=airing&limit=24`);
                const data = await res.json();
                displayAnime(data.data);
            } catch (err) {
                console.error(err);
                alert("ইন্টারনেট কানেকশন চেক করুন।");
            }
            showLoading(false);
        }

        // ২. এনিমে কার্ড তৈরি করা
        function displayAnime(list) {
            animeGrid.innerHTML = '';
            list.forEach(anime => {
                // Jikan API এর ডাটা ফরম্যাট একটু আলাদা হয়
                const title = anime.title;
                const image = anime.images.jpg.large_image_url;
                const id = anime.mal_id;

                const card = `
                    <div class="anime-card cursor-pointer group" onclick="loadDetails('${id}', '${title.replace(/'/g, "")}')">
                        <div class="relative overflow-hidden rounded-xl aspect-[3/4.5] bg-[#1f2833]">
                            <img src="${image}" class="w-full h-full object-cover">
                        </div>
                        <h3 class="mt-3 text-xs font-bold group-hover:cyan-text transition line-clamp-2">${title}</h3>
                    </div>
                `;
                animeGrid.innerHTML += card;
            });
        }

        // ৩. এনিমে সার্চ করা
        async function searchAnime() {
            const query = document.getElementById('searchInput').value;
            if(!query) return;
            showLoading(true);
            document.getElementById('listTitle').innerText = `Search Results: ${query}`;
            try {
                const res = await fetch(`${JIKAN_API}/anime?q=${query}&limit=24`);
                const data = await res.json();
                displayAnime(data.data);
            } catch (e) { alert("Search failed!"); }
            showLoading(false);
        }

        // ৪. এনিমে ডিটেইলস এবং এপিসোড (Stream API ব্যবহার করে)
        async function loadDetails(malId, title) {
            showLoading(true);
            try {
                // আমরা টাইটেল দিয়ে Consumet API তে সার্চ করবো ভিডিওর জন্য
                const searchRes = await fetch(`${STREAM_API}/${title}`);
                const searchData = await searchRes.json();
                
                if(searchData.results.length > 0) {
                    const animeId = searchData.results[0].id; // GogoAnime ID
                    const infoRes = await fetch(`${STREAM_API}/info/${animeId}`);
                    const infoData = await infoRes.json();

                    document.getElementById('mainContent').classList.add('hidden');
                    document.getElementById('playerSection').classList.remove('hidden');
                    document.getElementById('playingTitle').innerText = title;

                    const epList = document.getElementById('episodeList');
                    epList.innerHTML = '';
                    infoData.episodes.forEach(ep => {
                        epList.innerHTML += `<button onclick="playVideo('${ep.id}')" class="bg-[#0b0c10] hover:bg-[#45f3ff] hover:text-black px-4 py-2 rounded-lg text-xs font-bold transition">EP ${ep.number}</button>`;
                    });

                    if(infoData.episodes.length > 0) playVideo(infoData.episodes[0].id);
                } else {
                    alert("দুঃখিত, এই এনিমেটির ভিডিও সার্ভারে খুঁজে পাওয়া যায়নি।");
                }
            } catch(e) { alert("Video load error! API is busy."); }
            showLoading(false);
            window.scrollTo(0,0);
        }

        // ৫. ভিডিও প্লে করা
        async function playVideo(episodeId) {
            try {
                const res = await fetch(`${STREAM_API}/watch/${episodeId}`);
                const data = await res.json();
                const playerUrl = data.headers.Referer || data.sources[0].url;
                document.getElementById('mainPlayer').src = playerUrl;
            } catch(e) { alert("Player error!"); }
        }

        function closePlayer() {
            document.getElementById('mainContent').classList.remove('hidden');
            document.getElementById('playerSection').classList.add('hidden');
            document.getElementById('mainPlayer').src = '';
            document.getElementById('listTitle').innerText = "Trending Anime";
        }

        function showLoading(s) {
            loading.classList.toggle('hidden', !s);
            if(s) animeGrid.innerHTML = '';
        }

        document.getElementById('searchInput').addEventListener("keypress", (e) => { if (e.key === "Enter") searchAnime(); });

        window.onload = fetchTrending;
    </script>
</body>
</html>
