<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HiAnime Pro - Enhanced with AniList</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0b0b0b; color: #fff; font-family: 'Inter', sans-serif; }
        .anime-card:hover img { transform: scale(1.05); transition: 0.4s; }
        .loader { border: 4px solid #1a1a1a; border-top: 4px solid #57e3f2; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .banner-mask { background: linear-gradient(to bottom, transparent, #0b0b0b); }
    </style>
</head>
<body>

    <nav class="bg-[#111] p-4 flex flex-col md:flex-row justify-between items-center gap-4 sticky top-0 z-50 border-b border-gray-800">
        <h1 class="text-3xl font-black text-[#57e3f2] cursor-pointer" onclick="location.reload()">Hi<span class="text-white">Anime</span></h1>
        <div class="relative w-full md:w-1/2">
            <input id="searchInput" type="text" placeholder="Search anime..." class="w-full bg-[#1a1a1a] p-3 pl-5 rounded-xl outline-none border border-gray-700 focus:border-[#57e3f2] text-sm">
            <button onclick="searchAnime()" class="absolute right-4 top-3 text-[#57e3f2]"><i class="fa fa-search"></i></button>
        </div>
    </nav>

    <!-- Player & Details Section -->
    <div id="playerSection" class="hidden animate-fadeIn">
        <!-- Banner from AniList -->
        <div id="animeBanner" class="h-[300px] w-full bg-cover bg-center relative">
            <div class="absolute inset-0 banner-mask"></div>
            <button onclick="closePlayer()" class="absolute top-5 left-5 bg-black/50 p-2 rounded-full hover:bg-[#57e3f2] hover:text-black transition">
                <i class="fa fa-arrow-left px-2"></i>
            </button>
        </div>

        <div class="max-w-6xl mx-auto px-4 -mt-20 relative z-10">
            <div class="flex flex-col md:flex-row gap-8">
                <!-- Video Player -->
                <div class="flex-1">
                    <div class="aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl border border-gray-800">
                        <iframe id="mainPlayer" src="" class="w-full h-full" allowfullscreen frameborder="0"></iframe>
                    </div>
                    <h2 id="playingTitle" class="text-3xl font-bold mt-6 text-[#57e3f2]"></h2>
                    <p id="animeDesc" class="text-gray-400 mt-4 text-sm leading-relaxed line-clamp-3"></p>
                    
                    <div class="mt-8">
                        <h3 class="text-white mb-4 font-bold flex items-center gap-2 uppercase tracking-widest text-xs">
                            <i class="fa fa-play-circle text-[#57e3f2]"></i> Select Episode
                        </h3>
                        <div id="episodeList" class="flex flex-wrap gap-2 max-h-60 overflow-y-auto p-2 bg-gray-900/50 rounded-xl">
                            <!-- Episodes -->
                        </div>
                    </div>
                </div>

                <!-- Side Info (AniList Data) -->
                <div class="w-full md:w-72 space-y-4">
                    <div class="bg-[#1a1a1a] p-5 rounded-2xl border border-gray-800">
                        <p class="text-xs text-gray-500 uppercase font-bold mb-1">Score</p>
                        <p id="aniScore" class="text-2xl font-black text-yellow-400"></p>
                        <hr class="my-3 border-gray-800">
                        <p class="text-xs text-gray-500 uppercase font-bold mb-1">Genres</p>
                        <div id="aniGenres" class="flex flex-wrap gap-1"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Listing -->
    <main id="mainContent" class="p-6 max-w-7xl mx-auto">
        <h2 id="listTitle" class="text-2xl font-bold mb-8 border-l-4 border-[#57e3f2] pl-4 uppercase">Trending</h2>
        <div id="loading" class="flex justify-center hidden my-20"><div class="loader"></div></div>
        <div id="animeGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 lg:grid-cols-6 gap-6"></div>
    </main>

    <script>
        const API_SOURCES = [
            "https://anime-api-rn7p.onrender.com/anime/gogoanime",
            "https://c.delusionz.xyz/anime/gogoanime"
        ];
        const ANILIST_API = "https://graphql.anilist.co";

        // ১. AniList থেকে ডাটা আনার ফাংশন (GraphQL)
        async function fetchAniListData(title) {
            const query = `
                query ($search: String) {
                    Media (search: $search, type: ANIME) {
                        description
                        averageScore
                        bannerImage
                        genres
                    }
                }
            `;
            try {
                const response = await fetch(ANILIST_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, variables: { search: title } })
                });
                const json = await response.json();
                return json.data.Media;
            } catch (e) { return null; }
        }

        // ২. সাধারণ ডাটা ফেচিং
        async function fetchWithFallback(endpoint) {
            for (let api of API_SOURCES) {
                try {
                    const res = await fetch(`${api}${endpoint}`);
                    if (res.ok) return await res.json();
                } catch (err) { continue; }
            }
            throw new Error("All APIs down");
        }

        // ৩. এনিমে ডিটেইলস (Consumet + AniList)
        async function loadAnimeDetails(id, title) {
            showLoading(true);
            try {
                // Consumet থেকে এপিসোড আনা
                const data = await fetchWithFallback(`/info/${id}`);
                // AniList থেকে মেটাডাটা আনা
                const aniData = await fetchAniListData(title);

                document.getElementById('mainContent').classList.add('hidden');
                document.getElementById('playerSection').classList.remove('hidden');
                document.getElementById('playingTitle').innerText = title;
                
                // AniList ডাটা আপডেট করা
                if(aniData) {
                    document.getElementById('animeBanner').style.backgroundImage = `url(${aniData.bannerImage})`;
                    document.getElementById('animeDesc').innerHTML = aniData.description || "No description available.";
                    document.getElementById('aniScore').innerText = aniData.averageScore ? `${aniData.averageScore}%` : "N/A";
                    document.getElementById('aniGenres').innerHTML = aniData.genres.map(g => `<span class="bg-gray-800 text-[10px] px-2 py-1 rounded-md text-gray-300">${g}</span>`).join('');
                }

                const epList = document.getElementById('episodeList');
                epList.innerHTML = '';
                data.episodes.forEach(ep => {
                    epList.innerHTML += `<button onclick="playVideo('${ep.id}')" class="bg-[#2a2a2a] hover:bg-[#57e3f2] hover:text-black px-4 py-2 rounded-lg text-xs font-bold transition">EP ${ep.number}</button>`;
                });

                if(data.episodes.length > 0) playVideo(data.episodes[0].id);
            } catch(e) { alert("Load Error!"); }
            showLoading(false);
            window.scrollTo(0,0);
        }

        // বাকি ফাংশনগুলো আগের মতোই থাকবে (fetchTrending, searchAnime, playVideo)
        async function fetchTrending() {
            showLoading(true);
            try {
                const data = await fetchWithFallback('/top-airing');
                displayAnime(data.results);
            } catch (err) { alert("API Error!"); }
            showLoading(false);
        }

        function displayAnime(list) {
            const grid = document.getElementById('animeGrid');
            grid.innerHTML = '';
            list.forEach(anime => {
                grid.innerHTML += `
                    <div class="anime-card cursor-pointer group" onclick="loadAnimeDetails('${anime.id}', '${anime.title.replace(/'/g, "")}')">
                        <div class="relative overflow-hidden rounded-2xl aspect-[3/4.5] bg-gray-900">
                            <img src="${anime.image}" class="w-full h-full object-cover">
                        </div>
                        <h3 class="mt-3 text-xs font-bold group-hover:text-[#57e3f2] transition line-clamp-2">${anime.title}</h3>
                    </div>`;
            });
        }

        async function playVideo(episodeId) {
            try {
                const data = await fetchWithFallback(`/watch/${episodeId}`);
                document.getElementById('mainPlayer').src = data.headers.Referer || data.sources[0].url;
            } catch(e) { alert("Video Error!"); }
        }

        function closePlayer() {
            document.getElementById('mainContent').classList.remove('hidden');
            document.getElementById('playerSection').classList.add('hidden');
            document.getElementById('mainPlayer').src = '';
        }

        function showLoading(s) { 
            document.getElementById('loading').classList.toggle('hidden', !s);
            if(s) document.getElementById('animeGrid').innerHTML = '';
        }

        window.onload = fetchTrending;
    </script>
</body>
</html>
