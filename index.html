<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HiStream | Stable Pro Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #06090f; color: white; font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .anime-card { cursor: pointer; transition: 0.3s; position: relative; border-radius: 12px; overflow: hidden; }
        .anime-card:hover { transform: translateY(-8px); box-shadow: 0 10px 30px rgba(255, 92, 0, 0.3); }
        .anime-card img { width: 100%; height: 280px; object-fit: cover; }
        #player-box { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 15px; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
        .ep-btn { background: #111827; padding: 10px; border-radius: 8px; font-weight: bold; border: 1px solid #1f2937; text-align: center; cursor: pointer; transition: 0.2s; }
        .ep-btn:hover, .active-ep { background: #ff5c00; border-color: white; }
        .lang-btn { padding: 8px 15px; border-radius: 20px; font-size: 11px; font-weight: bold; background: #111827; border: 1px solid #333; }
        .lang-active { background: #ff5c00; border-color: white; }
        .loading { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #ff5c00; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none; }
    </style>
</head>
<body>

    <nav class="p-4 flex flex-col md:flex-row justify-between items-center glass sticky top-0 z-50 gap-4">
        <h1 class="text-3xl font-black text-[#ff5c00] tracking-tighter cursor-pointer" onclick="goHome()">HI<span class="text-white">STREAM</span></h1>
        <div class="flex w-full md:w-[500px]">
            <input id="searchInp" type="text" placeholder="Search anime..." class="bg-[#111827] px-5 py-3 rounded-l-xl outline-none w-full border border-gray-800 focus:border-[#ff5c00]">
            <button onclick="searchAnime()" class="bg-[#ff5c00] px-8 py-3 rounded-r-xl font-black">SEARCH</button>
        </div>
    </nav>

    <div class="container mx-auto p-4">
        
        <!-- Detail View -->
        <div id="detailView" class="hidden">
            <button onclick="goHome()" class="mb-6 text-[#ff5c00] font-bold">← BACK TO HOME</button>
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="lg:col-span-2">
                    <div id="player-box"></div>
                    <div class="mt-4 flex flex-wrap gap-3 items-center">
                        <span class="text-xs font-bold text-gray-500">AUDIO:</span>
                        <button onclick="changeLang('jp')" id="btn-jp" class="lang-btn lang-active">JAPANESE</button>
                        <button onclick="changeLang('en')" id="btn-en" class="lang-btn">ENGLISH</button>
                        <button onclick="changeLang('hi')" id="btn-hi" class="lang-btn">HINDI</button>
                        <button onclick="changeLang('bn')" id="btn-bn" class="lang-btn">BANGLA</button>
                    </div>
                    <div class="mt-6 p-6 glass rounded-2xl border-l-[6px] border-[#ff5c00]">
                        <h2 id="detTitle" class="text-3xl font-black"></h2>
                        <p id="detDesc" class="text-gray-400 mt-4 text-sm leading-relaxed"></p>
                    </div>
                </div>
                <div>
                    <h3 class="text-xl font-black mb-5 text-[#ff5c00]">EPISODES</h3>
                    <div id="epList" class="grid grid-cols-4 md:grid-cols-5 gap-3 max-h-[600px] overflow-y-auto pr-2"></div>
                </div>
            </div>
        </div>

        <!-- Home View -->
        <div id="homeView">
            <h3 id="sectionTitle" class="text-2xl font-black mb-8 text-[#ff5c00]">TRENDING NOW</h3>
            <div id="animeGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-6"></div>
        </div>

    </div>

    <script>
        const ANILIST = 'https://graphql.anilist.co';
        const CONSUMET = 'https://api.consumet.org/anime/gogoanime';
        let currentLang = 'jp';

        // ১. রিফ্রেশ সমস্যার সমাধান (Check Hash on load)
        window.addEventListener('hashchange', checkRoute);
        window.onload = checkRoute;

        function checkRoute() {
            const hash = window.location.hash.replace('#', '');
            if (hash) {
                openAnime(decodeURIComponent(hash));
            } else {
                goHome(false);
            }
        }

        function goHome(clearHash = true) {
            if(clearHash) window.location.hash = '';
            document.getElementById('homeView').classList.remove('hidden');
            document.getElementById('detailView').classList.add('hidden');
            loadTrending();
        }

        async function loadTrending() {
            const query = `query { Page(perPage: 24) { media(sort: TRENDING_DESC, type: ANIME) { title { english romaji } coverImage { large } } } }`;
            const res = await fetch(ANILIST, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query }) });
            const { data } = await res.json();
            renderCards(data.Page.media);
        }

        function renderCards(list) {
            const grid = document.getElementById('animeGrid');
            grid.innerHTML = "";
            list.forEach(anime => {
                const title = anime.title.english || anime.title.romaji;
                grid.innerHTML += `
                    <div class="anime-card" onclick="window.location.hash = '${encodeURIComponent(title)}'">
                        <img src="${anime.coverImage.large}">
                        <div class="p-3 bg-slate-900/50"><h4 class="text-[11px] font-bold truncate">${title}</h4></div>
                    </div>`;
            });
        }

        async function openAnime(title) {
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('detailView').classList.remove('hidden');
            document.getElementById('detTitle').innerText = title;
            fetchEpisodes(title);
        }

        async function fetchEpisodes(title) {
            const epListDiv = document.getElementById('epList');
            epListDiv.innerHTML = '<div class="loading"></div>';
            
            // নাম ফিক্স করার লজিক (যাতে এপিআই খুঁজে পায়)
            let searchQuery = title.split(':')[0].split('Season')[0].replace(/[^\w\s]/gi, '').trim();
            if(currentLang === 'en') searchQuery += " Dub";
            if(currentLang === 'hi') searchQuery += " Hindi";
            if(currentLang === 'bn') searchQuery += " Bangla";

            try {
                const sRes = await fetch(`${CONSUMET}/${searchQuery}`);
                const sData = await sRes.json();
                
                if(!sData.results.length) throw new Error();

                const animeId = sData.results[0].id;
                const iRes = await fetch(`${CONSUMET}/info/${animeId}`);
                const iData = await iRes.json();

                document.getElementById('detDesc').innerText = iData.description || "";
                epListDiv.innerHTML = "";
                iData.episodes.forEach(ep => {
                    epListDiv.innerHTML += `<button onclick="playVideo('${ep.id}', this)" class="ep-btn">${ep.number}</button>`;
                });

                if(iData.episodes.length > 0) playVideo(iData.episodes[0].id, document.querySelector('.ep-btn'));
            } catch (err) {
                epListDiv.innerHTML = `<p class="col-span-full text-red-500 text-xs">Episodes not found. Try another language.</p>`;
            }
        }

        function playVideo(id, btn) {
            document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active-ep'));
            if(btn) btn.classList.add('active-ep');
            const url = `https://www.social-stream.to/embed/gogoanime/${id}`;
            document.getElementById('player-box').innerHTML = `<iframe src="${url}" allowfullscreen="true" scrolling="no"></iframe>`;
        }

        function changeLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('lang-active'));
            document.getElementById('btn-' + lang).classList.add('lang-active');
            fetchEpisodes(document.getElementById('detTitle').innerText);
        }

        async function searchAnime() {
            const val = document.getElementById('searchInp').value;
            if(!val) return;
            const query = `query { Page(perPage: 24) { media(search: "${val}", type: ANIME) { title { english romaji } coverImage { large } } } }`;
            const res = await fetch(ANILIST, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query }) });
            const { data } = await res.json();
            renderCards(data.Page.media);
        }
    </script>
</body>
</html>
