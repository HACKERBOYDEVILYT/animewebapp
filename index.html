<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Anime Site</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white">
    <h1 class="text-center text-3xl my-10 font-bold">Latest Anime</h1>
    <div id="anime-list" class="grid grid-cols-2 md:grid-cols-5 gap-4 p-5">
        <!-- এনিমে এখানে লোড হবে -->
    </div>

    <script>
        // এই API টি এনিমে ডাটা প্রদান করে
        fetch('https://api.consumet.org/anime/gogoanime/top-airing')
        .then(response => response.json())
        .then(data => {
            const list = document.getElementById('anime-list');
            data.results.forEach(anime => {
                list.innerHTML += `
                    <div class="bg-gray-800 p-2 rounded-lg">
                        <img src="${anime.image}" class="w-full h-64 object-cover rounded">
                        <h3 class="mt-2 text-sm">${anime.title}</h3>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
