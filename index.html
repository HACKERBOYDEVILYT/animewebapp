<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HiStream | Multi-Server Streaming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #06090f; color: white; font-family: 'Poppins', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.08); }
        #player-container { width: 100%; aspect-ratio: 16/9; border-radius: 15px; overflow: hidden; background: #000; box-shadow: 0 10px 50px rgba(0,0,0,0.8); }
        iframe { width: 100%; height: 100%; border: none; }
        
        /* বড় এবং সুন্দর অ্যানিমে কার্ড */
        .anime-card { height: 110px; transition: 0.3s; border: 1px solid transparent; }
        .anime-card:hover { background: rgba(255, 92, 0, 0.1); border-color: #ff5c00; transform: translateX(5px); }
        .anime-card img { width: 75px; height: 100%; object-cover: cover; border-radius: 10px; }

        .ep-btn { background: #111827; padding: 12px; border-radius: 8px; font-weight: bold; border: 1px solid #1f2937; cursor: pointer; text-align: center; }
        .ep-btn:hover, .active-ep { background: #ff5c00; border-color: white; transform: scale(1.05); }

        .server-btn { background: #1f2937; padding: 8px 20px; border-radius: 5px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .server-btn:hover, .active-server { background: #ff5c00; color: white; }

        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #ff5c00; border-radius: 10px; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="p-4 flex flex-col md:flex-row justify-between items-center glass sticky top-0 z-50 gap-4">
        <h1 class="text-3xl font-black text-[#ff5c00] tracking-tighter cursor-pointer" onclick="location.reload()">HI<span class="text-white">STREAM</span></h1>
        <div class="flex w-full md:w-[600px]">
            <input id="searchInp" type="text" placeholder="Search anime (e.g. Solo Leveling)..." class="bg-[#111827] px-5 py-3 rounded-l-xl outline-none w-full border border-gray-800 focus:border-[#ff5c00]">
            <button onclick="searchAnime()" class="bg-[#ff5c00] px-8 py-3 rounded-r-xl font-black hover:bg-[#e65300] transition">SEARCH</button>
        </div>
    </nav>

    <div class="container mx-auto p-4 mt-4">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            
            <!-- Main Content (Player & Info) -->
            <div class="lg:col-span-3">
                <div id="player-container">
                    <div id="placeholder" class="h-full w-full flex flex-col items-center justify-center text-gray-500 bg-[#0d1117]">
                        <p class="text-xl">Select an anime to watch</p>
                    </div>
                </div>

                <!-- Server Selection -->
                <div id="server-bar" class="mt-4 flex gap-3 hidden">
                    <span class="text-sm font-bold text-gray-500 flex items-center">SERVERS:</span>
                    <button onclick="switchServer(1)" id="srv1" class="server-btn active-server">Server 1</button>
                    <button onclick="switchServer(2)" id="srv2" class="server-btn">Server 2</button>
                    <button onclick="switchServer(3)" id="srv3" class="server-btn">Server 3</button>
                </div>
                
                <div class="mt-6 p-6 glass rounded-2xl border-l-[6px] border-[#ff5c00]">
                    <h2 id="animeTitle" class="text-3xl font-black tracking-tight">Welcome Back!</h2>
                    <p id="animeDesc" class="text-gray-400 mt-3 text-sm leading-relaxed line-clamp-3">The ultimate anime experience is here. No busy servers, just non-stop streaming.</p>
                </div>

                <div class="mt-10">
                    <h3 class="text-xl font-bold mb-6 flex items-center gap-3">
                        <span class="h-7 w-2 bg-[#ff5c00] rounded-full"></span> EPISODES
                    </h3>
                    <div id="episodeList" class="grid grid-cols-4 sm:grid-cols-8 md:grid-cols-10 lg:grid-cols-12 gap-3">
                        <!-- Eps -->
                    </div>
                </div>
            </div>

            <!-- Sidebar (Anime Cards) -->
            <div class="lg:col-span-1">
                <h3 id="sideTitle" class="text-xl font-black mb-6 text-[#ff5c00] border-b border-gray-800 pb-2">TRENDING NOW</h3>
                <div id="results" class="flex flex-col gap-5 overflow-y-auto max-h-[90vh] pr-2 custom-scroll">
                    <!-- Cards will be larger now -->
                </div>
            </div>

        </div>
    </div>

    <script>
        const ANILIST_URL = 'https://graphql.anilist.co';
        const CONSUMET_URL = 'https://api.consumet.org/anime/gogoanime';
        
        let currentEpId = "";

        // ১. ট্রেন্ডিং লোড
        async function loadTrending() {
            const query = `query { Page(perPage: 15) { media(sort: TRENDING_DESC, type: ANIME) { title { english romaji } coverImage { large } description } } }`;
            const res = await fetch(ANILIST_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query })
            });
            const { data } = await res.json();
            displayResults(data.Page.media);
        }

        // ২. সার্চ
        async function searchAnime() {
            const val = document.getElementById('searchInp').value;
            if(!val) return;
            const query = `query { Page(perPage: 20) { media(search: "${val}", type: ANIME) { title { english romaji } coverImage { large } description } } }`;
            document.getElementById('results').innerHTML = "Searching...";
            const res = await fetch(ANILIST_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query })
            });
            const { data } = await res.json();
            displayResults(data.Page.media);
            document.getElementById('sideTitle').innerText = "SEARCH RESULTS";
        }

        function displayResults(list) {
            const resDiv = document.getElementById('results');
            resDiv.innerHTML = "";
            list.forEach(anime => {
                const title = anime.title.english || anime.title.romaji;
                resDiv.innerHTML += `
                    <div onclick="getEpisodes('${title}')" class="glass p-2 rounded-xl cursor-pointer flex gap-5 anime-card">
                        <img src="${anime.coverImage.large}" alt="img">
                        <div class="flex flex-col justify-center overflow-hidden">
                            <h4 class="text-sm font-bold line-clamp-2 group-hover:text-[#ff5c00]">${title}</h4>
                            <span class="text-[10px] text-gray-500 mt-2">⭐ High Quality</span>
                        </div>
                    </div>`;
            });
        }

        // ৩. এপিসোড আনা
        async function getEpisodes(title) {
            document.getElementById('episodeList').innerHTML = "Loading...";
            try {
                const sRes = await fetch(`${CONSUMET_URL}/${title}`);
                const sData = await sRes.json();
                const animeId = sData.results[0].id;

                const iRes = await fetch(`${CONSUMET_URL}/info/${animeId}`);
                const iData = await iRes.json();

                document.getElementById('animeTitle').innerText = iData.title;
                document.getElementById('animeDesc').innerHTML = iData.description || "No description available.";
                
                const epDiv = document.getElementById('episodeList');
                epDiv.innerHTML = "";
                iData.episodes.forEach(ep => {
                    epDiv.innerHTML += `<button onclick="playVideo('${ep.id}', this)" class="ep-btn">${ep.number}</button>`;
                });
                window.scrollTo({top: 0, behavior: 'smooth'});
            } catch (err) { alert("Server error. Try another anime."); }
        }

        // ৪. প্লেয়ার এবং সার্ভার সুইচ
        function playVideo(epId, btn) {
            currentEpId = epId;
            document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active-ep'));
            btn.classList.add('active-ep');
            document.getElementById('server-bar').classList.remove('hidden');
            switchServer(1);
        }

        function switchServer(num) {
            document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active-server'));
            document.getElementById('srv' + num).classList.add('active-server');

            let embedUrl = "";
            if(num === 1) embedUrl = `https://www.social-stream.to/embed/gogoanime/${currentEpId}`;
            if(num === 2) embedUrl = `https://un-block.me/api/embed?id=${currentEpId}`;
            if(num === 3) embedUrl = `https://api.consumet.org/anime/gogoanime/watch/${currentEpId}?server=gogocdn`;

            document.getElementById('player-container').innerHTML = `<iframe src="${embedUrl}" allowfullscreen="true" scrolling="no"></iframe>`;
        }

        window.onload = loadTrending;
    </script>
</body>
</html>
