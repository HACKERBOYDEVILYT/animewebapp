<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HiAnime Clone - Watch Free Anime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0b0b0b; color: #fff; font-family: 'Segoe UI', sans-serif; }
        .anime-card:hover img { transform: scale(1.05); transition: 0.3s; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #57e3f2; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="bg-[#1a1a1a] p-4 flex flex-col md:flex-row justify-between items-center gap-4 sticky top-0 z-50 border-b border-gray-800">
        <h1 class="text-2xl font-extrabold text-[#57e3f2] cursor-pointer" onclick="location.reload()">Hi<span class="text-white">Anime</span></h1>
        <div class="relative w-full md:w-1/2">
            <input id="searchInput" type="text" placeholder="Search anime..." class="w-full bg-[#2a2a2a] p-2 pl-4 rounded-full outline-none border border-transparent focus:border-[#57e3f2]">
            <button onclick="searchAnime()" class="absolute right-3 top-2 text-[#57e3f2]"><i class="fa fa-search"></i></button>
        </div>
    </nav>

    <!-- Hero / Player Section -->
    <div id="playerSection" class="hidden p-4 md:p-10 bg-[#141414]">
        <button onclick="closePlayer()" class="mb-4 text-gray-400 hover:text-white"><i class="fa fa-arrow-left"></i> Back to Home</button>
        <div class="max-w-5xl mx-auto">
            <div class="aspect-video bg-black rounded-lg overflow-hidden shadow-2xl border border-gray-800">
                <iframe id="mainPlayer" src="" class="w-full h-full" allowfullscreen frameborder="0"></iframe>
            </div>
            <h2 id="playingTitle" class="text-2xl font-bold mt-4 text-[#57e3f2]"></h2>
            <div id="episodeList" class="flex flex-wrap gap-2 mt-4 max-h-40 overflow-y-auto p-2 bg-[#1a1a1a] rounded">
                <!-- Episodes will load here -->
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main id="mainContent" class="p-6">
        <h2 id="listTitle" class="text-xl font-bold mb-6 border-l-4 border-[#57e3f2] pl-3">Trending Anime</h2>
        <div id="loading" class="flex justify-center hidden"><div class="loader"></div></div>
        <div id="animeGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 lg:grid-cols-6 gap-6">
            <!-- Anime Cards Load Here -->
        </div>
    </main>

    <script>
        const API_BASE = "https://api.consumet.org/anime/gogoanime";
        const animeGrid = document.getElementById('animeGrid');
        const loading = document.getElementById('loading');

        // ১. ট্রেন্ডিং এনিমে লোড করা
        async function fetchTrending() {
            showLoading(true);
            try {
                const res = await fetch(`${API_BASE}/top-airing`);
                const data = await res.json();
                displayAnime(data.results);
            } catch (err) { alert("API Error! Please refresh."); }
            showLoading(false);
        }

        // ২. এনিমে কার্ড তৈরি করা
        function displayAnime(list) {
            animeGrid.innerHTML = '';
            list.forEach(anime => {
                const card = `
                    <div class="anime-card cursor-pointer group" onclick="loadAnimeDetails('${anime.id}', '${anime.title}')">
                        <div class="relative overflow-hidden rounded-lg aspect-[3/4]">
                            <img src="${anime.image}" class="w-full h-full object-cover">
                            <div class="absolute bottom-0 left-0 right-0 p-2 bg-gradient-to-t from-black to-transparent text-xs">
                                ${anime.episodeNumber ? 'Ep ' + anime.episodeNumber : ''}
                            </div>
                        </div>
                        <h3 class="mt-2 text-sm font-medium group-hover:text-[#57e3f2] transition line-clamp-2">${anime.title}</h3>
                    </div>
                `;
                animeGrid.innerHTML += card;
            });
        }

        // ৩. এনিমে সার্চ করা
        async function searchAnime() {
            const query = document.getElementById('searchInput').value;
            if(!query) return;
            showLoading(true);
            document.getElementById('listTitle').innerText = `Search results for: ${query}`;
            const res = await fetch(`${API_BASE}/${query}`);
            const data = await res.json();
            displayAnime(data.results);
            showLoading(false);
        }

        // ৪. এনিমে ডিটেইলস এবং এপিসোড লোড
        async function loadAnimeDetails(id, title) {
            showLoading(true);
            const res = await fetch(`${API_BASE}/info/${id}`);
            const data = await res.json();
            
            document.getElementById('mainContent').classList.add('hidden');
            document.getElementById('playerSection').classList.remove('hidden');
            document.getElementById('playingTitle').innerText = title;
            
            const epList = document.getElementById('episodeList');
            epList.innerHTML = '';
            data.episodes.forEach(ep => {
                epList.innerHTML += `<button onclick="playVideo('${ep.id}')" class="bg-[#333] hover:bg-[#57e3f2] hover:text-black px-4 py-2 rounded text-sm transition">Ep ${ep.number}</button>`;
            });

            if(data.episodes.length > 0) playVideo(data.episodes[0].id);
            showLoading(false);
            window.scrollTo(0,0);
        }

        // ৫. ভিডিও প্লে করা
        async function playVideo(episodeId) {
            const res = await fetch(`${API_BASE}/watch/${episodeId}`);
            const data = await res.json();
            // আমরা সরাসরি তাদের Embed Player ব্যবহার করছি
            document.getElementById('mainPlayer').src = data.headers.Referer || data.sources[0].url;
        }

        function closePlayer() {
            document.getElementById('mainContent').classList.remove('hidden');
            document.getElementById('playerSection').classList.add('hidden');
            document.getElementById('mainPlayer').src = '';
        }

        function showLoading(status) {
            status ? loading.classList.remove('hidden') : loading.classList.add('hidden');
        }

        fetchTrending(); // Load home data
    </script>
</body>
</html>
