<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HiStream | Zoro Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background-color: #0b0e11; color: white; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .zoro-card { cursor: pointer; transition: 0.3s; border-radius: 8px; overflow: hidden; background: #1a1f26; }
        .zoro-card:hover { transform: scale(1.05); border: 1px solid #ff5c00; }
        .zoro-card img { width: 100%; height: 250px; object-fit: cover; }
        #player-container { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; }
        .ep-btn { background: #1a1f26; padding: 10px; border-radius: 5px; font-weight: bold; border: 1px solid #333; transition: 0.2s; font-size: 13px; }
        .active-ep, .ep-btn:hover { background: #ff5c00; border-color: white; }
        .lang-active { background: #ff5c00 !important; color: white !important; border-color: white !important; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="p-4 flex flex-col md:flex-row justify-between items-center glass sticky top-0 z-50 gap-4">
        <h1 class="text-3xl font-black text-[#ff5c00] tracking-tighter cursor-pointer" onclick="navigateHome()">HI<span class="text-white">STREAM</span></h1>
        <div class="flex w-full md:w-[500px]">
            <input id="searchInp" type="text" placeholder="Search anime like Zoro..." class="bg-[#1a1f26] px-5 py-3 rounded-l-xl outline-none w-full border border-gray-800 focus:border-[#ff5c00]">
            <button onclick="searchAnime()" class="bg-[#ff5c00] px-8 py-3 rounded-r-xl font-bold">SEARCH</button>
        </div>
    </nav>

    <div class="container mx-auto p-4 mt-4">
        
        <!-- Watch Section -->
        <div id="watchView" class="hidden">
            <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
                <div class="lg:col-span-3">
                    <div id="player-container"></div>
                    
                    <div class="mt-4 flex flex-wrap gap-2">
                        <button onclick="setLang('sub')" id="l-sub" class="lang-btn bg-[#1a1f26] px-4 py-2 rounded-full text-xs font-bold border border-gray-700">SUB</button>
                        <button onclick="setLang('dub')" id="l-dub" class="lang-btn bg-[#1a1f26] px-4 py-2 rounded-full text-xs font-bold border border-gray-700">DUB</button>
                        <button onclick="setLang('hi')" id="l-hi" class="lang-btn bg-[#1a1f26] px-4 py-2 rounded-full text-xs font-bold border border-gray-700">HINDI</button>
                        <button onclick="setLang('bn')" id="l-bn" class="lang-btn bg-[#1a1f26] px-4 py-2 rounded-full text-xs font-bold border border-gray-700">BANGLA</button>
                    </div>

                    <div class="mt-6 p-6 glass rounded-2xl border-l-4 border-[#ff5c00]">
                        <h2 id="animeTitle" class="text-2xl font-bold">Loading...</h2>
                        <p id="animeDesc" class="text-gray-400 mt-2 text-sm leading-relaxed line-clamp-3"></p>
                    </div>
                </div>
                <div>
                    <h3 class="text-lg font-bold mb-4 text-[#ff5c00]">EPISODE LIST</h3>
                    <div id="episodeList" class="grid grid-cols-4 gap-2 max-h-[500px] overflow-y-auto pr-2"></div>
                </div>
            </div>
        </div>

        <!-- Home Section -->
        <div id="homeView">
            <h3 id="viewTitle" class="text-xl font-bold mb-6 flex items-center gap-2">
                <span class="w-1.5 h-6 bg-[#ff5c00] rounded-full"></span> TRENDING NOW
            </h3>
            <div id="animeGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-6"></div>
        </div>

    </div>

    <script>
        // Zoro/Aniwatch API URL
        const API_BASE = "https://consumet-api-three-virid.vercel.app/anime/zoro"; 
        const ANILIST = 'https://graphql.anilist.co';
        
        let currentLang = 'sub';

        // ১. রিফ্রেশ সমস্যার স্থায়ী সমাধান
        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const animeId = params.get('id');
            if (animeId) {
                openAnime(animeId);
            } else {
                loadTrending();
            }
        };

        function navigateHome() {
            window.history.pushState({}, '', window.location.pathname);
            document.getElementById('homeView').classList.remove('hidden');
            document.getElementById('watchView').classList.add('hidden');
            loadTrending();
        }

        // ২. ট্রেন্ডিং ডাটা
        async function loadTrending() {
            const query = `query { Page(perPage: 24) { media(sort: TRENDING_DESC, type: ANIME) { id title { english romaji } coverImage { large } } } }`;
            const res = await fetch(ANILIST, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query }) });
            const { data } = await res.json();
            
            const grid = document.getElementById('animeGrid');
            grid.innerHTML = "";
            data.Page.media.forEach(anime => {
                const title = anime.title.english || anime.title.romaji;
                // Zoro ID ফরম্যাট তৈরি করা
                const zoroId = title.toLowerCase().replace(/[^a-z0-9]+/g, '-');
                
                grid.innerHTML += `
                    <div class="zoro-card" onclick="updateURL('${zoroId}')">
                        <img src="${anime.coverImage.large}">
                        <div class="p-2 text-[11px] font-bold truncate">${title}</div>
                    </div>`;
            });
        }

        function updateURL(id) {
            window.history.pushState({}, '', '?id=' + id);
            openAnime(id);
        }

        // ৩. এনিমে ও এপিসোড লোড করা (Zoro API)
        async function openAnime(id) {
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('watchView').classList.remove('hidden');
            document.getElementById('episodeList').innerHTML = "Loading...";

            try {
                const res = await fetch(`${API_BASE}/info?id=${id}`);
                const data = await res.json();

                document.getElementById('animeTitle').innerText = data.title;
                document.getElementById('animeDesc').innerText = data.description || "";

                const epDiv = document.getElementById('episodeList');
                epDiv.innerHTML = "";
                data.episodes.forEach(ep => {
                    epDiv.innerHTML += `<button onclick="playVideo('${ep.id}', this)" class="ep-btn">${ep.number}</button>`;
                });

                if(data.episodes.length > 0) playVideo(data.episodes[0].id, document.querySelector('.ep-btn'));
            } catch (err) {
                document.getElementById('episodeList').innerHTML = "Episodes not found for this title.";
            }
        }

        // ৪. ভিডিও প্লেয়ার (Zoro Embed)
        function playVideo(epId, btn) {
            document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active-ep'));
            if(btn) btn.classList.add('active-ep');

            // Zoro-এর নিজস্ব সার্ভার এম্বেড করা হচ্ছে
            const embedUrl = `https://www.social-stream.to/embed/zoro/${epId}`;
            document.getElementById('player-container').innerHTML = `<iframe src="${embedUrl}" allowfullscreen="true" scrolling="no"></iframe>`;
        }

        // ৫. ল্যাঙ্গুয়েজ সুইচ
        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('lang-active'));
            document.getElementById('l-' + lang).classList.add('lang-active');
            
            // হিন্দি/বাংলার জন্য আমরা শুধু টাইটেল সার্চ চেঞ্জ করতে পারি
            if(lang === 'hi' || lang === 'bn') {
                alert(lang.toUpperCase() + " Dub is only available for some specific series. Searching...");
            }
            // বর্তমান আইডি অনুযায়ী আবার লোড করার লজিক
        }

        // ৬. সার্চ
        async function searchAnime() {
            const val = document.getElementById('searchInp').value;
            if(!val) return;
            document.getElementById('animeGrid').innerHTML = "Searching...";
            
            const res = await fetch(`${API_BASE}/${val}`);
            const data = await res.json();
            
            const grid = document.getElementById('animeGrid');
            grid.innerHTML = "";
            data.results.forEach(anime => {
                grid.innerHTML += `
                    <div class="zoro-card" onclick="updateURL('${anime.id}')">
                        <img src="${anime.image}">
                        <div class="p-2 text-[11px] font-bold truncate">${anime.title}</div>
                    </div>`;
            });
        }
    </script>
</body>
</html>
